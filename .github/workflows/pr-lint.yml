name: PR Title Lint

# Enforces Conventional Commits on the *PR title*. Because we merge with
# "Squash and merge", the PR title becomes the commit message on main — so a
# clean title keeps the main history readable and machine-parseable (handy if
# you later add automated changelogs / semantic versioning).
#
# Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci,
# chore, revert. Example: "feat: add CSV export to results panel".

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
