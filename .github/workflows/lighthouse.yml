name: Lighthouse

# Performance / accessibility / best-practices / SEO guardrail. On each PR it
# builds the app, serves the production bundle, and runs Lighthouse against it.
# Assertions are set to "warn" (informational) because lab scores can be noisy
# in CI — the deterministic hard gate on weight is the bundle-size budget in CI.
# A public report link is posted for every run.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        # Informational only — never blocks a PR. Lab runs can be flaky in
        # headless CI (e.g. WebGL/GPU differences); the hard weight gate is the
        # deterministic bundle-size budget in the CI workflow.
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
