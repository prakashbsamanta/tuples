name: Deploy to GitHub Pages

# Production deployment. Fires only after code lands on main (i.e. after a PR
# merge that already passed the required CI checks). Uses the modern GitHub
# Pages flow that publishes straight from an Actions artifact — no `gh-pages`
# branch to maintain.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Scoped tokens for the official Pages actions:
#   - contents: read   → check out the repo
#   - pages: write     → publish to the Pages service
#   - id-token: write  → OIDC token the deploy step uses to authenticate
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; never cancel an in-flight deploy
# (cancelling mid-publish can leave the site half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The github-pages environment gives a deployment URL + history in the UI
    # and is where you can later add manual-approval protection rules.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
