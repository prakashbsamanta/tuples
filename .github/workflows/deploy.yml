name: Deploy to GitHub Pages

# Production deployment. Fires only after code lands on main (i.e. after a PR
# merge that already passed the required CI checks). Uses the modern GitHub
# Pages flow that publishes straight from an Actions artifact — no `gh-pages`
# branch to maintain.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Scoped tokens for the official Pages actions:
#   - contents: read   → check out the repo
#   - pages: write     → publish to the Pages service
#   - id-token: write  → OIDC token the deploy step uses to authenticate
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; never cancel an in-flight deploy
# (cancelling mid-publish can leave the site half-updated).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The github-pages environment gives a deployment URL + history in the UI
    # and is where you can later add manual-approval protection rules.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
