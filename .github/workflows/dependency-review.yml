name: Dependency Review

# Supply-chain gate on PRs. Diffs the dependency manifest/lockfile and fails
# the PR if it would introduce a package with a known vulnerability at or above
# the configured severity, or a disallowed license.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Block copyleft/network licenses that are risky for a hosted web app.
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: on-failure
