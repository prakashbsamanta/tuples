name: OpenSSF Scorecard

# Supply-chain posture audit. The OpenSSF Scorecard grades the repository
# against security best practices (branch protection, pinned dependencies,
# token permissions, dangerous workflow patterns, etc.) and publishes the
# results to the Security > Code scanning tab. Great for *learning* what a
# hardened repo looks like — each failing check links to a remediation guide.

on:
  branch_protection_rule: {}
  push:
    branches: [main]
  schedule:
    - cron: '18 5 * * 2' # Tuesdays 05:18 UTC

# Declared at workflow level as read-only; the job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF results
      id-token: write        # publish results to the public Scorecard API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
