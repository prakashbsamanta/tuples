name: CI

# Continuous Integration — the quality gate every change must pass.
# Runs on every PR targeting main, and on direct pushes to main (post-merge
# safety net). Branch protection makes the `build-test` check required, so a PR
# cannot be merged unless this is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: this workflow only needs to read the repo contents.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what's in package-lock.json — reproducible,
      # and it fails if the lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `npm run build` runs `tsc -b` (type-check) then `vite build`, so a type
      # error or a broken build fails the gate here.
      - name: Build
        run: npm run build

      # Keep the production bundle around for inspection / debugging a run.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7
