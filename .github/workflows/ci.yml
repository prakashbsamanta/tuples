name: CI

# Continuous Integration — the quality gate every change must pass.
# Runs on every PR targeting main, and on direct pushes to main (post-merge
# safety net). Branch protection makes the `build-test` check required, so a PR
# cannot be merged unless this is green.
#
# Every run (PR and production) also publishes a machine-readable run record to
# the `ci-reports` branch, which feeds the public reports dashboard at
# /tuples/reports/ — six months of unit/integration/e2e/coverage/bundle/
# Lighthouse history with links back to each run's logs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege by default; the report-publishing job elevates contents to
# write for itself only.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what's in package-lock.json — reproducible,
      # and it fails if the lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Unit + integration tests with coverage and a JSON results file for the
      # reports dashboard. The default reporter keeps human-readable CI logs.
      - name: Unit & integration tests
        run: >
          npm test --
          --coverage
          --reporter=default
          --reporter=json
          --outputFile=reports/vitest.json

      # `npm run build` runs `tsc -b` (type-check) then `vite build`, so a type
      # error or a broken build fails the gate here.
      - name: Build
        if: always()
        run: npm run build

      # Fail the build if the gzipped critical-path bundle exceeds its budget.
      # Also writes reports/size.json for the dashboard.
      - name: Bundle-size budget
        if: always()
        run: npm run size

      # Keep the production bundle around for inspection / debugging a run.
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

      # End-to-end smoke: boots the production build in vite preview and walks
      # the real user journeys (homepage triptych → world → solve a step on the
      # WASM engine → persistence → review; proof playground; theming; exam).
      - name: Install Playwright Chromium
        if: always()
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: always()
        run: npm run test:e2e

      # Lighthouse lab data for the dashboard (perf/a11y/best-practices +
      # FCP/LCP/TBT/CLS). Informational — lab scores are noisy in CI; the
      # deterministic weight gate is the bundle-size budget above.
      - name: Lighthouse (report data)
        if: always()
        continue-on-error: true
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/tuples/ >/dev/null 2>&1 && break || sleep 1
          done
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())") \
            npx lighthouse http://localhost:4173/tuples/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices \
            --output=json --output-path=reports/lighthouse-full.json
          kill %1 || true

      # Assemble the run record (works on partial data when earlier gates
      # failed — failed runs belong on the dashboard too).
      - name: Collect run record
        if: always()
        run: node scripts/report/collect.mjs

      - name: Upload report data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-data
          path: reports
          retention-days: 30

  # Publishes the run record to the ci-reports branch that backs the public
  # reports dashboard. Runs even when build-test fails (failures are data),
  # but only for same-repo refs (a fork PR has no write token).
  publish-report:
    name: publish-report
    needs: build-test
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ci-reports-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout ci-reports branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ci-reports
          path: ci-reports

      - name: Download report data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-data
          path: reports

      - name: Publish run record
        run: node scripts/report/publish.mjs ci-reports

      - name: Commit & push (with retry for concurrent runs)
        run: |
          cd ci-reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "report: ${{ github.event_name }} run ${{ github.run_id }} (${{ github.sha }})"
          for attempt in 1 2 3 4 5; do
            if git push origin ci-reports; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest ci-reports."
            git fetch origin ci-reports
            git rebase origin/ci-reports
          done
          echo "Failed to push report after 5 attempts." >&2
          exit 1
