# Dependabot keeps dependencies patched automatically. It opens PRs (which then
# run through the full CI + security pipeline like any other change) for:
#   1. npm packages  — security + version updates
#   2. GitHub Actions — so our SHA-pinned actions get bumped to new releases
#      (Dependabot updates both the SHA and the `# vX` comment).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    # Deliberately hold the build toolchain on the Vite 7 line for stability.
    # Vite 8 / plugin-react 6 / vitest must move together (shared Vite major),
    # so we don't let Dependabot bump these majors piecemeal — revisit manually
    # once the Vite 8 ecosystem has matured. See docs/devops/PIPELINE.md.
    ignore:
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
    groups:
      # Batch low-risk dev/minor/patch bumps into one PR to reduce noise.
      dev-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    labels: [ci]
    commit-message:
      prefix: ci
