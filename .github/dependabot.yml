# Dependabot keeps dependencies patched automatically. It opens PRs (which then
# run through the full CI + security pipeline like any other change) for:
#   1. npm packages  — security + version updates
#   2. GitHub Actions — so our SHA-pinned actions get bumped to new releases
#      (Dependabot updates both the SHA and the `# vX` comment).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    # Major versions of coupled/breaking deps are pinned and upgraded manually
    # (in one coordinated, verified PR each), NOT bumped piecemeal by Dependabot.
    # Minor/patch updates for all of these still flow normally.
    # See docs/devops/PIPELINE.md "Build-toolchain version policy".
    ignore:
      # Build toolchain — must move together on a shared Vite major (held at 7).
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: '@vitejs/plugin-react'
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # React ecosystem — app + @react-three/fiber 8 are built on React 18.
      # Moving to React 19 requires @react-three/fiber 9 in the same PR.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: '@types/react'
        update-types: ["version-update:semver-major"]
      - dependency-name: '@types/react-dom'
        update-types: ["version-update:semver-major"]
      - dependency-name: '@react-three/fiber'
        update-types: ["version-update:semver-major"]
      # Recharts 3 is a breaking API rewrite; chart code targets the v2 API.
      - dependency-name: recharts
        update-types: ["version-update:semver-major"]
      # react-hooks 7 enables React-Compiler rules that flag intentional
      # three.js buffer mutations; held at v5 until that code is refactored.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a CSS-first rewrite (new config + PostCSS pipeline);
      # held at v3 until a deliberate migration.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # ESLint 10 is blocked by typescript-eslint 8 / react-hooks 5 peers;
      # held at v9 until the plugin ecosystem supports it.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: '@eslint/js'
        update-types: ["version-update:semver-major"]
    groups:
      # Batch low-risk dev/minor/patch bumps into one PR to reduce noise.
      dev-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    labels: [ci]
    commit-message:
      prefix: ci
